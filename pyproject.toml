[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "jpl-debias-2018"
version = "2023.3.1.1"
description = "JPL EFCC18 astrometric catalog-debias reference data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "B612 Asteroid Institute", email = "info@b612foundation.org" },
]
keywords = ["astronomy", "astrometry", "asteroids", "catalog", "debiasing", "JPL"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/B612-Asteroid-Institute/jpl_debias_2018"
Repository = "https://github.com/B612-Asteroid-Institute/jpl_debias_2018"
"Upstream data" = "https://ssd.jpl.nasa.gov/ftp/ssd/debias/debias_2018.tgz"

[project.optional-dependencies]
test = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.8",
]
build = [
    "build==1.6.1",
    "twine==7.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jpl_debias_2018 = [
    "bias.dat",
    "UPSTREAM_README.txt",
    "SOURCE_MANIFEST.json",
    "SOURCE_INVENTORY.json",
    "py.typed",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/jpl_debias_2018", "tools", "tests"]
