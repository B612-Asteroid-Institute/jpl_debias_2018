name: Build and test data package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: jpl-debias-2018-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip '.[test]'
      - name: Check formatting
        run: python -m ruff format --check src tests tools
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Type-check
        run: python -m mypy
      - name: Test committed authority and mutation guards
        run: python -m pytest

  reproducible:
    name: Two-clean-clone reproducibility
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned build frontend
        run: python -m pip install --upgrade pip '.[build]'
      - name: Require byte-identical clean-clone artifacts
        run: python tools/check_reproducible_builds.py

  artifact:
    name: Build and inspect artifacts
    needs: [test, reproducible]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned artifact tools
        run: python -m pip install --upgrade pip '.[build]'
      - name: Build canonical wheel and source distribution
        run: python tools/build_release.py
      - name: Verify exact source, metadata, and packaged bytes
        run: python tools/verify_artifacts.py dist/*.whl dist/*.tar.gz
      - name: Check package metadata rendering
        run: python -m twine check dist/*
      - name: Smoke-test the installed wheel away from source
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import hashlib
          from importlib import metadata
          from pathlib import Path
          import jpl_debias_2018 as data

          path = Path(data.bias_dat)
          assert path.is_absolute() and path.is_file()
          assert path.stat().st_size == data.BIAS_DAT_SIZE_BYTES
          assert hashlib.sha256(path.read_bytes()).hexdigest() == data.BIAS_DAT_SHA256
          assert data.SOURCE_ARCHIVE_SHA256 == "288132cefea7f1bdf0989782db1173948dd7dfef7da31910be90b16b73cfea6c"
          distribution = metadata.distribution("jpl-debias-2018")
          assert distribution.metadata.get("License") is None
          assert distribution.metadata.get("License-Expression") == "MIT"
          assert all("extra ==" in value for value in (distribution.requires or []))
          PY
      - name: Upload reviewed build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jpl-debias-2018-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
