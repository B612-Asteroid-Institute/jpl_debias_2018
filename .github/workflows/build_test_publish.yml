name: Build, Test and Publish

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    permissions:
      contents: read
    uses: ./.github/workflows/build_test.yml

  publish:
    needs: build-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact validated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jpl-debias-2018-${{ github.sha }}
          path: dist
      - name: Record exact publication hashes
        run: sha256sum dist/* | sort
      - name: Publish exact validated artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          verbose: true
